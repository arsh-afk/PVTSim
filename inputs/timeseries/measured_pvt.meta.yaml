# Meta file for the data file with the same name. Fill every null field. The agent reads this before the CSV.
# Units go here per column, not in the CSV body (except where a unit column exists in the CSV).
file: measured_pvt.csv
description: Measured array data for validation, wide format
needed_by_phase: 3
encoding: UTF-8
delimiter: comma
decimal_separator: period
header_row: true
data_origin: null
data_origin_options:
- measured_onsite
- measured_other_site
- typical_year
- datasheet
- lab_report
- other_described_in_notes
provenance_ref: null
notes: null
timezone_note: Timestamps carry an explicit offset; also state the site time zone name here
site_timezone: null
timestamp_convention: null
timestamp_convention_options:
- interval_start
- interval_end
- instantaneous
interval: null
interval_note: Time between rows, with unit; state if irregular
qc_flag_codes: null
qc_flag_note: List each code and what it means; the agent never reinterprets a code
columns:
- name: timestamp
  description: Time, ISO 8601 with explicit UTC offset
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: poa_irradiance
  description: Measured plane-of-array irradiance
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: t_ambient
  description: Ambient temperature
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: t_module_back
  description: PV module back-surface temperature
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: dc_voltage
  description: DC voltage
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: dc_current
  description: DC current
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: dc_power
  description: DC power
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: loop_flow
  description: Collector loop flow
  required: false
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: t_collector_in
  description: Collector inlet fluid temperature
  required: false
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: t_collector_out
  description: Collector outlet fluid temperature
  required: false
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: pump_power
  description: Pump electrical power
  required: false
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: pump_state
  description: On or off
  required: false
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: qc_flag
  description: Your quality code
  required: false
  unit: null
  quantity_kind: null
  sensor_or_source: null
