# Meta file for the data file with the same name. Fill every null field. The agent reads this before the CSV.
# Units go here per column, not in the CSV body (except where a unit column exists in the CSV).
file: feed_water_quality.csv
description: 'Water quality at the unit inlet, long format: one row per parameter per time'
needed_by_phase: 6
encoding: UTF-8
delimiter: comma
decimal_separator: period
header_row: true
data_origin: null
data_origin_options:
- measured_onsite
- measured_other_site
- typical_year
- datasheet
- lab_report
- other_described_in_notes
provenance_ref: null
notes: null
timezone_note: Timestamps carry an explicit offset; also state the site time zone name here
site_timezone: null
timestamp_convention: null
timestamp_convention_options:
- interval_start
- interval_end
- instantaneous
interval: null
interval_note: Time between rows, with unit; state if irregular
qc_flag_codes: null
qc_flag_note: List each code and what it means; the agent never reinterprets a code
columns:
- name: timestamp
  description: Time, ISO 8601 with explicit UTC offset
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: species_id
  description: Must match a species_id in the species registry table
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: value
  description: Measured value
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: unit
  description: Unit string of this value
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: origin
  description: sensor or lab
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: sample_id
  description: Lab sample id or sensor id
  required: false
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: qc_flag
  description: Your quality code
  required: false
  unit: null
  quantity_kind: null
  sensor_or_source: null
