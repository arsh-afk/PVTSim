# Meta file for the data file with the same name. Fill every null field. The agent reads this before the CSV.
# Units go here per column, not in the CSV body (except where a unit column exists in the CSV).
file: tariffs.csv
description: Electricity prices by period
needed_by_phase: 9
encoding: UTF-8
delimiter: comma
decimal_separator: period
header_row: true
data_origin: null
data_origin_options:
- measured_onsite
- measured_other_site
- typical_year
- datasheet
- lab_report
- other_described_in_notes
provenance_ref: null
notes: null
timezone_note: Timestamps carry an explicit offset; also state the site time zone name here
site_timezone: null
timestamp_convention: null
timestamp_convention_options:
- interval_start
- interval_end
- instantaneous
interval: null
interval_note: Time between rows, with unit; state if irregular
qc_flag_codes: null
qc_flag_note: List each code and what it means; the agent never reinterprets a code
columns:
- name: period_start
  description: Start of period, ISO 8601 with explicit UTC offset
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: period_end
  description: End of period, ISO 8601 with explicit UTC offset
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: import_price
  description: Price per energy unit for imported electricity
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: export_price
  description: Price per energy unit for exported electricity
  required: false
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: currency
  description: Currency code
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
