# Meta file for the data file with the same name. Fill every null field. The agent reads this before the CSV.
# Units go here per column, not in the CSV body (except where a unit column exists in the CSV).
file: dhw_draw.csv
description: Hot-water draw and cold make-up temperature
needed_by_phase: 4
encoding: UTF-8
delimiter: comma
decimal_separator: period
header_row: true
data_origin: null
data_origin_options:
- measured_onsite
- measured_other_site
- typical_year
- datasheet
- lab_report
- other_described_in_notes
provenance_ref: null
notes: null
timezone_note: Timestamps carry an explicit offset; also state the site time zone name here
site_timezone: null
timestamp_convention: null
timestamp_convention_options:
- interval_start
- interval_end
- instantaneous
interval: null
interval_note: Time between rows, with unit; state if irregular
qc_flag_codes: null
qc_flag_note: List each code and what it means; the agent never reinterprets a code
columns:
- name: timestamp
  description: Time, ISO 8601 with explicit UTC offset
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: draw_volume_flow
  description: Hot-water draw at the tank outlet
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: makeup_temperature
  description: Temperature of cold make-up water entering the tank
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: requested_delivery_temperature
  description: Delivery temperature wanted by the user, if it varies
  required: false
  unit: null
  quantity_kind: null
  sensor_or_source: null
