# AquaSolar Living parameter template.
# HOW TO FILL: for each entry set `value`, `unit`, `source_type`, `source_ref`, `uncertainty`, `valid_range`,
# then set `status: confirmed` (only you do this). Leave an entry as `draft` and the simulation will refuse to run.
# If `required_when` is false for your setup, set `status: not_applicable` and leave value empty.
# `unit` must be a unit string the agent's unit library parses; the agent lists accepted examples in docs/units_accepted.md.
# For categorical entries, `value` must be exactly one of `allowed_values`.
# The agent must not edit any `value`, `unit` or `status` field.
