# Meta file for the data file with the same name. Fill every null field. The agent reads this before the CSV.
# Units go here per column, not in the CSV body (except where a unit column exists in the CSV).
file: sensors.csv
description: Sensor specifications for the optional sensor layer
needed_by_phase: 7
encoding: UTF-8
delimiter: comma
decimal_separator: period
header_row: true
data_origin: null
data_origin_options:
- measured_onsite
- measured_other_site
- typical_year
- datasheet
- lab_report
- other_described_in_notes
provenance_ref: null
notes: null
columns:
- name: sensor_id
  description: Unique id
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: measured_species_id
  description: species_id or physical quantity name
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: range_low
  description: Lower measurement range
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: range_high
  description: Upper measurement range
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: unit
  description: Unit string
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: noise_kind
  description: gaussian_absolute, gaussian_relative or none
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: noise_value
  description: Standard deviation in the stated kind
  required: false
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: bias
  description: Constant offset
  required: false
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: drift_rate
  description: Drift per unit time
  required: false
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: dropout_probability
  description: Probability per time step
  required: false
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: response_time
  description: Sensor lag
  required: false
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: location
  description: inlet or outlet
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: source_ref
  description: Datasheet or calibration file
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
