services:
  - type: web
    name: aquasolar-readonly
    runtime: python
    plan: free
    buildCommand: pip install ".[solar]"
    startCommand: uvicorn aquasolar.web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/config
    envVars:
      - key: AQUASOLAR_READ_ONLY
        value: "true"
      - key: AQUASOLAR_ALLOW_PVT_RUNS
        value: "true"
