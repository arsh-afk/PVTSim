[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aquasolar"
version = "0.1.0"
description = "AquaSolar Living - villa-scale PVT + water-assurance simulator"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AquaSolar Team"}
]
dependencies = [
    "numpy>=1.23.2",
    "pandas>=1.5.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "scipy>=1.9.2",
    "matplotlib>=3.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pytest>=7.0",
    "hypothesis>=6.0",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
units = ["pint>=0.23"]
solar = ["pvlib>=0.15"]
sensitivity = ["SALib>=1.4"]
properties = ["iapws>=1.5"]
dev = [
    "pytest>=7.0",
    "hypothesis>=6.0",
    "pytest-cov>=4.0",
]

[project.scripts]
aquasolar = "aquasolar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aquasolar = ["static/*", "static/report-showcase/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--import-mode=importlib"
