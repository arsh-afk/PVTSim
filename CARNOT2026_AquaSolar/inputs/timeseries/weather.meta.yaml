# Meta file for the data file with the same name. Fill every null field. The agent reads this before the CSV.
# Units go here per column, not in the CSV body (except where a unit column exists in the CSV).
file: weather.csv
description: Site weather at the simulation interval or finer
needed_by_phase: 1
encoding: UTF-8
delimiter: comma
decimal_separator: period
header_row: true
data_origin: other_described_in_notes
data_origin_options:
- measured_onsite
- measured_other_site
- typical_year
- datasheet
- lab_report
- other_described_in_notes
provenance_ref: ../../POWER_Point_Hourly.json
notes: NASA POWER hourly point export for the project location. Radiation values were exported in Wh/m^2 and converted to hourly-average W/m^2 because each record represents a one-hour interval. POA irradiance, cloud cover, and QC flags were not included in the export and remain blank. Source coordinates and units are recorded in the source JSON.
timezone_note: Source JSON time_standard is UTC. CSV timestamps retain UTC with an explicit +00:00 offset.
site_timezone: Asia/Dubai
timestamp_convention: interval_start
timestamp_convention_options:
- interval_start
- interval_end
- instantaneous
interval: 1 hour
interval_note: Regular one-hour records; the NASA POWER hourly timestamp key is retained as the start of the corresponding hour.
qc_flag_codes: null
qc_flag_note: List each code and what it means; the agent never reinterprets a code
columns:
- name: timestamp
  description: Time, ISO 8601 with explicit UTC offset
  required: true
  unit: null
  quantity_kind: timestamp
  sensor_or_source: NASA POWER Hourly API time key, UTC
- name: ghi
  description: Global horizontal irradiance
  required: true
  unit: W/m2
  quantity_kind: irradiance
  sensor_or_source: ALLSKY_SFC_SW_DWN, Wh/m^2 per one-hour interval
- name: dni
  description: Direct normal irradiance
  required: true
  unit: W/m2
  quantity_kind: irradiance
  sensor_or_source: ALLSKY_SFC_SW_DNI, Wh/m^2 per one-hour interval
- name: dhi
  description: Diffuse horizontal irradiance
  required: true
  unit: W/m2
  quantity_kind: irradiance
  sensor_or_source: ALLSKY_SFC_SW_DIFF, Wh/m^2 per one-hour interval
- name: poa_irradiance
  description: Measured plane-of-array irradiance, if you have it
  required: false
  unit: W/m2
  quantity_kind: irradiance
  sensor_or_source: Not supplied; leave blank pending confirmed collector orientation and approved transposition
- name: t_ambient
  description: Ambient air temperature
  required: true
  unit: C
  quantity_kind: temperature
  sensor_or_source: T2M, air temperature at 2 m
- name: wind_speed
  description: Wind speed at the height stated in the meta file
  required: true
  unit: m/s
  quantity_kind: null
  sensor_or_source: WS10M, wind speed at 10 m
- name: relative_humidity
  description: Needed only if an approved model uses it
  required: false
  unit: "%"
  quantity_kind: dimensionless
  sensor_or_source: RH2M, relative humidity at 2 m
- name: cloud_cover
  description: Needed only if an approved model uses it
  required: false
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: qc_flag
  description: Quality code from your own scheme, defined in the meta file
  required: false
  unit: null
  quantity_kind: null
  sensor_or_source: null
