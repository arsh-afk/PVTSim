# Meta file for the data file with the same name. Fill every null field. The agent reads this before the CSV.
# Units go here per column, not in the CSV body (except where a unit column exists in the CSV).
file: species_registry.csv
description: Every water-quality parameter the simulation tracks
needed_by_phase: 1
encoding: UTF-8
delimiter: comma
decimal_separator: period
header_row: true
data_origin: null
data_origin_options:
- measured_onsite
- measured_other_site
- typical_year
- datasheet
- lab_report
- other_described_in_notes
provenance_ref: null
notes: null
columns:
- name: species_id
  description: Short id, no spaces; used everywhere else
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: display_name
  description: Readable name
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: species_class
  description: dissolved, particulate, disinfectant or physical
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: unit
  description: Unit string used throughout
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: tracked
  description: yes or no
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: is_sensor_channel
  description: yes if an online sensor measures it
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: notes
  description: Anything else
  required: false
  unit: null
  quantity_kind: null
  sensor_or_source: null
