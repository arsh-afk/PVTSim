# Meta file for the data file with the same name. Fill every null field. The agent reads this before the CSV.
# Units go here per column, not in the CSV body (except where a unit column exists in the CSV).
file: controller_rules.csv
description: Deployable MNT controller rules
needed_by_phase: 7
encoding: UTF-8
delimiter: comma
decimal_separator: period
header_row: true
data_origin: null
data_origin_options:
- measured_onsite
- measured_other_site
- typical_year
- datasheet
- lab_report
- other_described_in_notes
provenance_ref: null
notes: null
columns:
- name: rule_id
  description: Unique id
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: priority
  description: Evaluation order, lowest first
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: input_signal
  description: species_id or other signal name
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: comparison
  description: greater_than, less_than, between
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: threshold_low
  description: Value, empty if not applicable
  required: false
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: threshold_high
  description: Value, empty if not applicable
  required: false
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: unit
  description: Unit string
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: action_pathway
  description: Pathway id selected when the rule fires
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: hysteresis
  description: Band to avoid chatter, empty if none
  required: false
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: min_dwell
  description: Minimum time in the selected pathway, empty if none
  required: false
  unit: null
  quantity_kind: null
  sensor_or_source: null
