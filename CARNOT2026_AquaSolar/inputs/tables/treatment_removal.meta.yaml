# Meta file for the data file with the same name. Fill every null field. The agent reads this before the CSV.
# Units go here per column, not in the CSV body (except where a unit column exists in the CSV).
file: treatment_removal.csv
description: Removal or rejection per stage per species
needed_by_phase: 6
encoding: UTF-8
delimiter: comma
decimal_separator: period
header_row: true
data_origin: null
data_origin_options:
- measured_onsite
- measured_other_site
- typical_year
- datasheet
- lab_report
- other_described_in_notes
provenance_ref: null
notes: null
columns:
- name: stage_id
  description: sediment, carbon, uf, membrane, remin or uv
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: species_id
  description: Must exist in species_registry
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: removal_basis
  description: fraction_removed, fraction_passed, or added_concentration
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: value
  description: Value in the stated basis
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: condition_note
  description: Operating condition the value applies to
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: uncertainty_kind
  description: absolute, relative or none
  required: false
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: uncertainty_value
  description: Magnitude of the uncertainty
  required: false
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: source_type
  description: measured, datasheet, literature, standard or assumption
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: source_ref
  description: File in inputs/provenance or a citation you verified
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
- name: status
  description: draft or confirmed
  required: true
  unit: null
  quantity_kind: null
  sensor_or_source: null
